# Builds the Windows desktop installer and uploads it to a DRAFT GitHub release.
#
# Release: bump "version" in desktop/package.json, commit, then
#   git tag desktop-v<version> && git push origin desktop-v<version>
# When the job finishes, review the draft release on GitHub and publish it —
# installed apps pick the update up from the published release (see docs/desktop.md).
name: Desktop release

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch: # manual dry run: builds and uploads the installer as an artifact only

permissions:
  contents: write # create/update the draft release

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      # The ~220 MB of model checkpoints come from Git LFS; caching them keeps
      # repeated builds from eating the repository's LFS bandwidth quota.
      - name: List LFS objects
        shell: bash
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
      - name: Cache LFS objects
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
      - name: Pull LFS objects
        run: git lfs pull

      - name: Tag matches desktop/package.json version
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#desktop-v}"
          pkg="$(node -p "require('./desktop/package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag desktop-v$tag does not match desktop/package.json version $pkg"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      # Python archive + pip wheel cache (torch alone is ~125 MB).
      - name: Cache runtime downloads
        uses: actions/cache@v4
        with:
          path: desktop/build/cache
          key: runtime-${{ hashFiles('desktop/requirements.lock.txt', 'desktop/scripts/build-runtime.ps1') }}
          restore-keys: runtime-

      - name: Bundled Python runtime
        shell: pwsh
        run: ./desktop/scripts/build-runtime.ps1

      # The same interpreter and packages the installer ships — including torch,
      # which the ML tests need. A throwaway venv on top keeps pytest out of the
      # shipped runtime.
      - name: Backend tests on the bundled runtime
        shell: pwsh
        working-directory: backend
        run: |
          ../desktop/build/runtime/python/python.exe -m venv --system-site-packages ../desktop/build/test-venv
          ../desktop/build/test-venv/Scripts/python.exe -m pip install --no-warn-script-location pytest pytest-asyncio
          ../desktop/build/test-venv/Scripts/python.exe -m pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Frontend static export
        working-directory: frontend
        run: |
          npm ci
          npm run build:desktop

      - name: Electron dependencies
        working-directory: desktop
        run: npm ci

      - name: Build installer and upload to draft release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release

      - name: Build installer (dry run)
        if: ${{ !startsWith(github.ref, 'refs/tags/desktop-v') }}
        working-directory: desktop
        run: npm run dist

      # Tag builds already attach the installer to the release; only a manual
      # dry run needs it as an artifact (~1 GB, so kept briefly).
      - name: Upload installer artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/desktop-v') }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-installer
          path: |
            desktop/dist/*.exe
            desktop/dist/latest.yml
          retention-days: 3
