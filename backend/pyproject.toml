[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "space-weather-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "redis>=5.0",
    "httpx>=0.27",
    "astropy>=6.0",
    "numpy>=1.26",
    "scipy>=1.13",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "Pillow>=10.3",
    "apscheduler>=3.10",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Native ML burst detection — install with: pip install -e ".[ml]"
# torch/torchvision are large (~700 MB); on Apple Silicon, pip selects the
# arm64 wheel automatically. On CPU-only machines use:
#   pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
ml = [
    "torch>=2.1",
    "torchvision>=0.16",
]
# SDO/AIA Data Analysis (SunPy gallery workflows) — install with:
#   pip install -e ".[sci]"
# SunPy pulls Fido (drms/zeep/parfive) and map tooling (reproject, mpl-animators);
# aiapy adds AIA level-1.5 prep; imageio-ffmpeg supplies an ffmpeg for movie export.
sci = [
    "sunpy[map,net]>=6.0",
    "aiapy>=0.9",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pytest-cov>=5.0",
    "aiosqlite>=0.20",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
