[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "space-weather-backend"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "redis>=5.0",
    "httpx>=0.27",
    # Anthropic SDK — powers the natural-language "State of the Sun" briefing
    # (app/services/briefing_service.py). A missing ANTHROPIC_API_KEY disables the
    # feature gracefully, so the dependency is safe to ship in the base image.
    "anthropic>=0.69",
    "astropy>=6.0",
    "numpy>=1.26",
    "scipy>=1.13",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
    "Pillow>=10.3",
    "apscheduler>=3.10",
    "python-multipart>=0.0.9",
    # Multi-mission Solar Image Analysis (Data Analysis page) — core, not
    # optional: the feature is a first-class part of the dashboard and a plain
    # `pip install -e .` must yield a fully working backend on every machine.
    # SunPy pulls Fido (zeep/parfive); drms is the JSOC fast path; reproject
    # powers the HMI composite + multi-viewpoint reprojection; aiapy adds AIA
    # level-1.5 prep; imageio-ffmpeg supplies ffmpeg for movie export.
    "sunpy[map,net]>=6.0",
    "aiapy>=0.9",
    "drms>=0.7",
    "reproject>=0.13",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
# Native ML burst detection — install with: pip install -e ".[ml]"
# torch/torchvision are large (~700 MB); on Apple Silicon, pip selects the
# arm64 wheel automatically. On CPU-only machines use:
#   pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
ml = [
    "torch>=2.1",
    "torchvision>=0.16",
]
# Legacy alias — the scientific packages moved into the core dependencies above
# (2026-07-12) so `pip install -e .` always includes them. Kept so existing
# commands/docs (`pip install -e ".[sci]"`, the Dockerfile) keep working.
sci = []
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pytest-cov>=5.0",
    "aiosqlite>=0.20",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
