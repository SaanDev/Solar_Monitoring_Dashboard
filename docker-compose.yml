services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: swdash
      POSTGRES_PASSWORD: swdash
      POSTGRES_DB: swdash
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swdash"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      # Set INSTALL_ML=false in .env for a lean image without PyTorch (runs the
      # whole dashboard except native radio-burst detection). Defaults to a full
      # image with the ML classifier.
      args:
        INSTALL_ML: "${INSTALL_ML:-true}"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://swdash:swdash@postgres:5432/swdash
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /data
      # Burst inference runs natively inside this backend (PyTorch via the
      # ".[ml]" extras baked into the image; checkpoint at ml_model/best.pt).
      # Containers have no GPU/MPS, so force CPU.
      ML_INFERENCE_DEVICE: cpu
    ports:
      - "8000:8000"
    volumes:
      - app_data:/data
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      # Docker Desktop on Windows/WSL2 does not forward inotify file-change
      # events into bind mounts, so next dev's watcher never sees host edits and
      # HMR silently no-ops. Force webpack to poll the filesystem so source
      # changes on the Windows host recompile without a container restart.
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  app_data:
