services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: swdash
      POSTGRES_PASSWORD: swdash
      POSTGRES_DB: swdash
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swdash"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://swdash:swdash@postgres:5432/swdash
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /data
      ML_INFERENCE_URL: http://ml-inference:9000
    ports:
      - "8000:8000"
    volumes:
      - app_data:/data
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-inference:
        condition: service_started

  # ML burst-classifier inference service. Built from the sibling Burst Identifier
  # project (reuses its inference code); the 129 MB checkpoint is mounted at
  # runtime rather than baked into the image.
  ml-inference:
    build:
      context: "../Burst Identifier"
      dockerfile: Dockerfile.serve
    environment:
      MODEL_CHECKPOINT: outputs/v2_resnet18/checkpoints/best.pt
      MODEL_CONFIG: configs/v2_resnet18_rtx5060_8gb.yaml
      INFERENCE_DEVICE: cpu
    ports:
      - "9000:9000"
    volumes:
      - "../Burst Identifier/outputs:/app/outputs:ro"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:9000/healthz').getcode()==200 else 1)
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s

  frontend:
    build: ./frontend
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  app_data:
