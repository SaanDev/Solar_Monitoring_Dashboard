<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'" />
    <title>Solar Monitoring Dashboard</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0f1117; color: #e2e8f0;
        font-family: "Segoe UI", system-ui, sans-serif; -webkit-app-region: drag; user-select: none; }
      body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
      img { width: 88px; height: 88px; animation: pulse 2.4s ease-in-out infinite; }
      h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: 0.01em; }
      p { margin: 0; font-size: 12px; color: #94a3b8; text-align: center; max-width: 320px; line-height: 1.5; }
      @keyframes pulse { 50% { transform: scale(1.06); filter: brightness(1.15); } }
    </style>
  </head>
  <body>
    <img src="icon.png" alt="" />
    <h1>Solar Monitoring Dashboard</h1>
    <p>Starting the data services…<br />The first launch sets up the local database and can take a minute.</p>
  </body>
</html>
