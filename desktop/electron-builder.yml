# Windows installer (NSIS) and Linux package (.deb) for the desktop app. Build
# with scripts/build.ps1 on Windows or scripts/build.sh on Linux; both first
# stage the Python runtime (build/runtime) and the static UI (../frontend/out)
# that extraResources below pick up.
appId: org.saandev.solardashboard
productName: Solar Monitoring Dashboard
copyright: Copyright © SaanDev

directories:
  output: dist
  buildResources: assets

# The Electron shell only. Production node_modules are added automatically.
files:
  - out/**/*
  - assets/**/*
  - "!assets/installer.nsh"
  # Full-size source art; icon.ico/icon.png are generated from it.
  - "!assets/Logo.png"
  - package.json

# Shipped unpacked next to the app (process.resourcesPath) — the interpreter has
# to run from real files, and the backend reads alembic/ and ml_model/ from disk.
extraResources:
  - from: build/runtime/python
    to: python
  - from: build/runtime/backend
    to: backend
  - from: ../frontend/out
    to: frontend

win:
  target:
    - target: nsis
      arch: x64
  icon: assets/icon.ico

nsis:
  oneClick: false
  # Per-user install under %LOCALAPPDATA%\Programs: no admin prompt, and
  # auto-updates never need elevation.
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Solar Monitoring Dashboard
  # User data lives in %LOCALAPPDATA%\SolarDashboard; installer.nsh asks
  # before removing it on a real uninstall (never on an update).
  deleteAppDataOnUninstall: false
  include: assets/installer.nsh
  artifactName: SolarMonitoringDashboard-Setup-${version}.${ext}

linux:
  target:
    - target: deb
      arch: x64
  # 512 px, installed as the hicolor app icon; desktops scale it down.
  icon: assets/icon.png
  executableName: solar-monitoring-dashboard
  # With desktopName in package.json, the .desktop file name, StartupWMClass and
  # Electron's app_id/WM_CLASS all agree, so docks group the window with its launcher.
  syncDesktopName: true
  category: Education;Science;Astronomy
  synopsis: Space-weather monitoring dashboard
  # The package description and the launcher's tooltip (Comment=). Set here, not
  # in package.json, whose description is also the Windows installer's.
  description: >-
    Monitors solar radio bursts (e-CALLISTO), GOES X-ray and proton flux, solar
    and coronagraph images, geomagnetic indices and the solar wind, with alerts.
  maintainer: SaanDev <SaanDev@users.noreply.github.com>
  desktop:
    entry:
      Keywords: space weather;solar;sun;radio burst;e-CALLISTO;GOES;

# Installs to /opt/Solar Monitoring Dashboard and links /usr/bin/solar-monitoring-dashboard.
# User data lives in ~/.local/share/SolarDashboard; removing the package leaves it.
deb:
  packageName: solar-monitoring-dashboard
  packageCategory: science
  artifactName: SolarMonitoringDashboard-${version}-${arch}.${ext}

publish:
  provider: github
  owner: SaanDev
  repo: Solar_Monitoring_Dashboard
  # Releases use the default tag v<version> (e.g. v1.0.0-beta) — the tag that
  # triggers CI. Keep it: an installed prerelease (x.y.z-beta) checks for
  # updates by reading every release tag as semver, and a custom prefix like
  # "desktop-v" fails that parse, so such installs would never see an update.
  # Every v* release should therefore carry the desktop installer.
  # CI uploads to a draft; publishing it on GitHub is what ships the update.
  releaseType: draft
